name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # Speech's DictationTranscriber and the macOS 26 deployment target need Xcode 26 or newer.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Unit tests
        run: swift test

      - name: Build the app
        run: SIGN_IDENTITY=- bash scripts/build.sh

  release:
    # Pushing a tag such as v0.2.0 publishes an Apple silicon disk image as a GitHub release;
    # the app's updater finds it there.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Import the signing certificate
        # Optional: without the secrets the release is signed ad hoc and users re-grant permissions after updates.
        env:
          P12: ${{ secrets.SIRIPLUS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.SIRIPLUS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No signing secret; releasing with an ad-hoc signature."; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$keychain" > /dev/null
          echo "SIRIPLUS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIRIPLUS_SIGNING_KEYCHAIN_PASSWORD=ci" >> "$GITHUB_ENV"

      - name: Build the disk image
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Install / Установка

          Download **SiriPlus-$version-arm64.dmg** (Apple silicon, macOS 26+).

          Siri+ is not signed with an Apple Developer ID, so macOS blocks the downloaded app. After copying it to Applications, run:
          У Siri+ нет подписи Apple Developer ID, поэтому macOS блокирует скачанное приложение. После копирования в «Программы» выполните:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/SiriPlus.app
          \`\`\`

          Or right-click **Install Siri+.command** in the disk image → Open. / Или в образе: правый щелчок по **Install Siri+.command** → Открыть.

          Installed versions update themselves: menu bar → Check for Updates… / Установленная версия обновляется сама: строка меню → Проверить обновления…

          Siri+ is free and open source. Support its development on [Boosty](https://boosty.to/rtm00). / Поддержать разработку: [Boosty](https://boosty.to/rtm00).
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "dist/SiriPlus-$version-arm64.dmg" \
            "dist/SiriPlus-$version-arm64.dmg.sha256" \
            --title "Siri+ $version" \
            --notes-file notes.md \
            --generate-notes
