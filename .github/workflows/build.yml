name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Speech's DictationTranscriber and the macOS 26 deployment target need Xcode 26 or newer.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Unit tests
        run: swift test

      - name: Build the app
        run: |
          xcodebuild \
            -project SiriPlus.xcodeproj \
            -scheme SiriPlus \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build

      - name: Package
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/SiriPlus.app SiriPlus.zip
          shasum -a 256 SiriPlus.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SiriPlus
          path: SiriPlus.zip

      # Pushing a tag such as v0.3.0 publishes the zip as a GitHub release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" SiriPlus.zip --generate-notes
